services:
  blog:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret}
      BLOG_DATABASE_URL: sqlite:////data/blog_engine.db
      BLOG_SEED_DEMO: ${BLOG_SEED_DEMO:-true}
    volumes:
      - blog_data:/data
    restart: unless-stopped

volumes:
  blog_data:
